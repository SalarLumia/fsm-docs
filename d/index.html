<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>سند — فولاد شرق ماهان</title>
<link rel="icon" href="../fsm-favicon.svg">
<style>
  @font-face{font-family:IRANSans;src:url("../fonts/IRANSans.ttf") format("truetype");font-weight:400;font-display:swap}
  @font-face{font-family:IRANSans;src:url("../fonts/IRANSans_Bold.ttf") format("truetype");font-weight:700;font-display:swap}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;
    font-family:IRANSans,system-ui,sans-serif;background:#f5f4f1;color:#4a4a4a}
  .card{width:100%;max-width:380px;text-align:center;background:#fff;border:1px solid #e6e4df;
    border-radius:14px;padding:28px 22px;box-shadow:0 2px 14px #00000010}
  .mark{width:74px;height:auto;margin-bottom:16px}
  .num{direction:ltr;font-size:14px;font-weight:700;letter-spacing:.5px;color:#1c1c1e;
    background:#faf9f7;border:1px solid #e6e4df;border-radius:8px;padding:9px 12px;margin:0 0 16px;
    word-break:break-all}
  .msg{font-size:12.5px;line-height:1.9;color:#848484;margin:0 0 18px}
  .go{display:inline-block;text-decoration:none;background:#f7941f;color:#fff;font-family:inherit;
    font-size:13px;font-weight:700;padding:11px 26px;border-radius:9px;border:none;cursor:pointer}
  .go:hover{background:#d97d10}
  .err{display:none;font-size:12.5px;color:#b91c1c;line-height:1.9;margin:0 0 14px}
</style>
</head>
<body>
<div class="card">
  <img class="mark" src="../fsm-mark.svg" alt="فولاد شرق ماهان">
  <p class="err" id="err">شمارهٔ سندی در این نشانی نیست. کد را دوباره اسکن کنید.</p>
  <div class="num" id="num">—</div>
  <p class="msg">برای دیدنِ این سند باید وارد سامانه شوید.</p>
  <a class="go" id="go" href="../index.html">ورود به سامانه</a>
</div>
<script>
/* این صفحه فقط یک نقطهٔ تغییرمسیر است، نه صفحهٔ نهایی.
   دلیلِ وجودش: نشانیِ چاپ‌شده روی کاغذ باید کوتاه و پایدار باشد. اگر روزی
   بخواهیم اسکن‌کننده را جای دیگری بفرستیم (مثلاً نمای عمومیِ فقط‌خواندنی)،
   فقط رفتارِ همین فایل عوض می‌شود و هیچ نقشهٔ چاپ‌شده‌ای نمی‌شکند. */
(function(){
  var m=/[?&]n=([^&]*)/.exec(location.search);
  var n=m?decodeURIComponent(m[1]).trim().toUpperCase():"";
  if(!n){ document.getElementById("err").style.display="block";
          document.getElementById("num").style.display="none";
          document.getElementById("go").textContent="ورود به سامانه"; return; }
  document.getElementById("num").textContent=n;
  var target="../index.html#/doc/"+encodeURIComponent(n);
  document.getElementById("go").setAttribute("href",target);
  /* اگر کاربر از قبل نشستِ فعال دارد، معطلش نمی‌کنیم و مستقیم می‌رویم.
     نشست فقط «ادعا» است و اعتبارش را بک‌اند تعیین می‌کند؛ اینجا صرفاً برای
     صرفه‌جویی در یک کلیک است، نه تصمیمِ امنیتی. */
  try{
    var s=localStorage.getItem("fsm_session");
    if(s){
      var v=JSON.parse(s);
      if(v && v.token && (!v.expiresAt || Date.now() < v.expiresAt)) location.replace(target);
    }
  }catch(e){}
})();
</script>
</body>
</html>
