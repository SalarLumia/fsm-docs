        '<td class="c-mid"><span class="en-shift t-body"><bdi>'+settingsEscape(row.en)+'</bdi></span></td>'+
        '<td class="c-mid"><span class="unit-shift t-code"><bdi>'+settingsEscape(row.code)+'</bdi></span></td>'+
        '<td class="c-mid">'+scope+'</td><td class="col-act"><div class="row-actions">'+settingsActions()+'</div></td></tr>';
    }
    function settingsUserRow(row){
      return '<tr><td><div class="u-cell"><span class="u-av lg">ع</span><span class="u-name">آقای '+settingsEscape(row.name)+'</span></div></td>'+
        '<td class="c-mid"><span class="en-shift t-code"><bdi>'+settingsEscape(row.username)+'</bdi></span></td>'+
        '<td class="t-body">'+settingsEscape(row.position)+'</td><td><span class="tag role-admin">مدیر</span></td>'+
        '<td><div class="row-actions">'+settingsActions()+'</div></td></tr>';
    }
    function settingsRows(setting){
      if(!setting.rows.length)return settingsEmptyRow(setting.columns.length);
      return setting.rows.map(function(row){
        if(setting.id==="parts")return settingsPartRow(setting,row);
        if(setting.id==="doctypes")return settingsDocTypeRow(setting,row);
        if(setting.id==="users")return settingsUserRow(row);
        return "";
      }).join("");
    }
    function settingsCard(setting){
      var tableClass=setting.id==="users"?"users-table":"mgmt-table "+setting.table;
      return '<section class="card" id="setting-'+setting.id+'">'+settingsHeader(setting)+
        '<div class="tablewrap"><table class="'+tableClass+'">'+settingsTableHead(setting)+
        '<tbody>'+settingsRows(setting)+'</tbody></table></div></section>';
    }
    function settingsGroupView(group){
      return '<div class="settings-cards">'+group.settings.map(settingsCard).join("")+'</div>';
    }
    function settingsOne(){
      var selectedGroup=settingsGroups.filter(function(group){return group.id===selectedSettingsGroup;})[0]||settingsGroups[0];
      selectedSettingsGroup=selectedGroup.id;
      return '<div class="settings-layout"><nav class="settings-index" aria-label="گروه‌های تنظیمات">'+
        '<h2 class="settings-index-title t-section">'+settingsIcon('<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>')+'<span>انواع تنظیمات</span></h2><div class="settings-nav-list">'+settingsGroups.map(function(group){
          var categoryIcon=group.icon;
          var active=group.id===selectedGroup.id;
          return '<div class="settings-nav-group"><div class="settings-nav-row'+(active?' active':'')+'"><button class="settings-category t-sub" type="button" data-settings-group="'+group.id+'" aria-pressed="'+active+'">'+
            '<span class="settings-category-icon">'+settingsIcon(categoryIcon)+'</span><span class="settings-category-label">'+settingsEscape(group.name)+'</span></button></div>'+
            '<div class="settings-subnav" role="list" aria-label="فهرست‌های '+settingsEscape(group.name)+'">'+group.settings.map(function(setting){
              return '<div class="settings-subitem" role="listitem">'+settingsIcon(settingsItemIcon(setting),'settings-subitem-icon')+'<span>'+settingsEscape(setting.name)+'</span></div>';
            }).join("")+'</div></div>';
        }).join("")+'</div></nav><section class="settings-content" aria-live="polite">'+
        settingsGroupView(selectedGroup)+'</section></div>';
    }
    function settingsFaNumber(value){
      return String(value).replace(/\d/g,function(digit){return "۰۱۲۳۴۵۶۷۸۹"[Number(digit)];});
    }
    function renderSettings(){
      settingsHost.innerHTML=settingsOne();
      settingsHost.querySelector(".settings-index-title span").textContent="دسته‌بندی";
      var content=settingsHost.querySelector(".settings-content");
      if(content)content.classList.add("is-changing");
    }
    function updateSettingsSelection(){
      var selectedGroup=settingsGroups.filter(function(group){return group.id===selectedSettingsGroup;})[0];
      if(!selectedGroup)return;
      settingsHost.querySelectorAll("[data-settings-group]").forEach(function(button){
        var active=button.getAttribute("data-settings-group")===selectedGroup.id;
        button.closest(".settings-nav-row").classList.toggle("active",active);
        button.setAttribute("aria-pressed",String(active));
      });
      var content=settingsHost.querySelector(".settings-content");
      if(!content)return;
      content.classList.remove("is-changing");
      void content.offsetWidth;
      content.innerHTML=settingsGroupView(selectedGroup);
      content.classList.add("is-changing");
    }
    settingsHost.addEventListener("click",function(event){
      var category=event.target.closest("[data-settings-group]");
      if(category){
        var selectedGroup=settingsGroups.filter(function(group){return group.id===category.getAttribute("data-settings-group");})[0];
        if(!selectedGroup)return;
        selectedSettingsGroup=selectedGroup.id;
        updateSettingsSelection();
      }
    });
    renderSettings();
  </script>
</body>
</html>
