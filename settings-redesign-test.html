            group.lists.map(function(list){return '<button type="button" class="nav-item" data-list="'+list.id+'" aria-pressed="'+(list.id===activeList)+'">'+escText(list.name)+'</button>';}).join("")+
            '</div></div>';
        }).join("")+'</nav><section class="content-panel">'+detailMarkup(findList(activeList))+'</section></div>';
    }
    function accordionMarkup(groups){
      if(!groups.length)return '<div class="empty">فهرستی با این جست‌وجو پیدا نشد.</div>';
      if(!groups.some(function(group){return group.lists.some(function(list){return list.id===activeList;});}))activeList=groups[0].lists[0].id;
      var first=groups[0]&&groups[0].id;
      return '<div class="accordion-list">'+groups.map(function(group){
        return '<details class="group-box" '+(group.id===first?"open":"")+'><summary class="group-summary"><span class="group-title"><svg viewBox="0 0 24 24" aria-hidden="true">'+group.icon+'</svg>'+escText(group.name)+'</span><span class="group-meta">'+faNumber(group.lists.length)+' فهرست<svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></span></summary><div class="group-content">'+
          group.lists.map(function(list){return '<div class="list-row"><strong>'+escText(list.name)+'</strong><span>'+escText(list.description)+'</span><button type="button" data-list="'+list.id+'">نمایش نمونه</button></div>';}).join("")+
          '</div></details>';
      }).join("")+'</div><div class="accordion-detail">'+detailMarkup(findList(activeList))+'</div>';
    }
    function tabsMarkup(groups){
      var group=groups.filter(function(item){return item.id===activeGroup;})[0]||groups[0];
      if(!group){return '<div class="empty">فهرستی با این جست‌وجو پیدا نشد.</div>';}
      if(!group.lists.some(function(list){return list.id===activeList;})){activeList=group.lists[0].id;}
      return '<div class="tabs" role="group" aria-label="گروه تنظیمات">'+groups.map(function(item){
        return '<button type="button" class="group-tab" data-group="'+item.id+'" aria-pressed="'+(item.id===group.id)+'">'+escText(item.name)+'</button>';
      }).join("")+'</div><div class="tile-grid">'+group.lists.map(function(list){
        return '<button type="button" class="list-tile" data-list="'+list.id+'" aria-pressed="'+(list.id===activeList)+'"><strong>'+escText(list.name)+'</strong><span>'+escText(list.description)+'</span></button>';
      }).join("")+'</div>'+detailMarkup(findList(activeList));
    }
    function renderPreview(){
      var groups=filteredGroups();
      var info=optionInfo[activeOption];
      document.getElementById("previewHeading").textContent=info.title;
      document.getElementById("previewDescription").textContent=info.description;
      previewBody.innerHTML=activeOption==="sidebar"?sidebarMarkup(groups):activeOption==="accordion"?accordionMarkup(groups):tabsMarkup(groups);
      document.querySelectorAll(".option").forEach(function(button){
        button.setAttribute("aria-pressed",String(button.getAttribute("data-option")===activeOption));
      });
    }
    document.querySelector(".options").addEventListener("click",function(event){
      var button=event.target.closest("[data-option]");
      if(!button)return;
      activeOption=button.getAttribute("data-option");
      renderPreview();
    });
    previewBody.addEventListener("click",function(event){
      var listButton=event.target.closest("[data-list]");
      var groupButton=event.target.closest("[data-group]");
      if(listButton)activeList=listButton.getAttribute("data-list");
      if(groupButton)activeGroup=groupButton.getAttribute("data-group");
      if(listButton||groupButton)renderPreview();
    });
    document.getElementById("settingsSearch").addEventListener("input",function(event){
      searchText=event.target.value.trim();
      renderPreview();
    });
    renderPreview();
  </script>

    var settingsHost=document.getElementById("tab-data");

    function settingsEscape(value){
      return String(value).replace(/[&<>"']/g,function(char){
        return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[char];
      });
    }
    function settingsIcon(paths,className){
      return '<svg'+(className?' class="'+className+'"':'')+' viewBox="0 0 24 24" aria-hidden="true">'+paths+'</svg>';
    }
    function settingsActions(){
      return '<span class="icon-btn settings-static-action" title="ویرایش" aria-hidden="true">'+settingsIcon('<path d="m16 4 4 4L8 20H4v-4z"/><path d="m14 6 4 4"/>','ic')+'</span>'+
        '<span class="icon-btn settings-static-action" title="حذف" aria-hidden="true">'+settingsIcon('<path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="m19 6-1 14H6L5 6"/><path d="M10 11v5m4-5v5"/>','ic')+'</span>';
    }
    function settingsActionHeader(){
      return '<span class="icon-btn settings-add" title="افزودن" aria-hidden="true">'+settingsIcon('<line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>','ic')+'</span>';
    }
    function settingsHeader(setting){
      return '<h3 class="spec-sec-t">'+settingsIcon(setting.icon)+'<span>'+settingsEscape(setting.name)+'</span><span class="sec-act">'+settingsActionHeader()+'</span></h3>';
    }
    function settingsEmptyRow(count){
      return '<tr><td colspan="'+count+'" class="muted settings-empty" style="text-align:center;padding:14px">موردی نیست.</td></tr>';
    }
    function settingsTableHead(setting){
      return '<thead><tr>'+setting.columns.map(function(column,index){
        var title=index===0?'<span class="th-exp"><span class="tbl-exp settings-static-action" aria-hidden="true">'+settingsIcon('<polyline points="6 9 12 15 18 9"/>','chev')+'</span>'+settingsEscape(column)+'</span>':
          '<span'+(index===1?' class="en-shift"':'')+'>'+settingsEscape(column)+'</span>';
        return '<th>'+title+'</th>';
      }).join("")+'</tr></thead>';
    }
    function settingsBadge(setting,code){
      return '<span class="el-badge">'+settingsIcon(setting.badge).replace("</svg>",'<text class="el-code" x="12" y="16" text-anchor="middle">'+settingsEscape(code)+'</text></svg>')+'</span>';
    }
    function settingsPartRow(setting,row){
      return '<tr><td><div class="pm-cell">'+settingsBadge(setting,row.code)+'<span class="nm-fa">'+settingsEscape(row.fa)+'</span></div></td>'+
        '<td class="spec-en c-mid"><span class="en-shift"><bdi>'+settingsEscape(row.en)+'</bdi></span></td>'+
        '<td class="col-act"><div class="row-actions">'+settingsActions()+'</div></td></tr>';
    }
    function settingsDocTypeRow(setting,row){
      var project=row.scope==="project";
      var scope=project?'<span class="tag proj">پروژه</span>':'<span class="tag">قطعه</span>';
      return '<tr><td><div class="pm-cell">'+settingsBadge(setting,row.code)+'<span class="nm-fa">'+settingsEscape(row.fa)+'</span></div></td>'+
        '<td class="spec-en c-mid"><span class="en-shift"><bdi>'+settingsEscape(row.en)+'</bdi></span></td>'+
        '<td class="spec-en c-mid"><span class="unit-shift"><bdi>'+settingsEscape(row.code)+'</bdi></span></td>'+
        '<td class="c-mid">'+scope+'</td><td class="col-act"><div class="row-actions">'+settingsActions()+'</div></td></tr>';
    }
    function settingsUserRow(row){
      return '<tr><td><div class="u-cell"><span class="u-av lg">ع</span><span class="u-name">آقای '+settingsEscape(row.name)+'</span></div></td>'+
        '<td class="spec-en c-mid"><span class="en-shift"><bdi>'+settingsEscape(row.username)+'</bdi></span></td>'+
        '<td class="meta-txt">'+settingsEscape(row.position)+'</td><td><span class="tag role-admin">مدیر</span></td>'+
        '<td><div class="row-actions">'+settingsActions()+'</div></td></tr>';
    }
    function settingsRows(setting){
      if(!setting.rows.length)return settingsEmptyRow(setting.columns.length);
      return setting.rows.map(function(row){
        if(setting.id==="parts")return settingsPartRow(setting,row);
        if(setting.id==="doctypes")return settingsDocTypeRow(setting,row);
        if(setting.id==="users")return settingsUserRow(row);
        return "";
      }).join("");
    }
    function settingsCard(setting){
      var tableClass=setting.id==="users"?"users-table":"mgmt-table "+setting.table;
      return '<section class="card" id="setting-'+setting.id+'">'+settingsHeader(setting)+
        '<div class="tablewrap"><table class="'+tableClass+'">'+settingsTableHead(setting)+
        '<tbody>'+settingsRows(setting)+'</tbody></table></div></section>';
    }
    function settingsGroupMarkup(group,includeTitle){
      return '<section class="settings-group" id="'+(includeTitle?"group-":"group-content-")+group.id+'">'+
        (includeTitle?'<h2 class="settings-group-title" id="heading-'+group.id+'">'+settingsEscape(group.name)+'</h2>':'')+
        group.settings.map(settingsCard).join("")+'</section>';
    }
    function settingsOne(){
      var selectedGroup=settingsGroups.filter(function(group){return group.id===selectedSettingsGroup;})[0]||settingsGroups[0];
      var selected=selectedGroup.settings.filter(function(setting){return setting.id===selectedSetting;})[0]||selectedGroup.settings[0];
      selectedSettingsGroup=selectedGroup.id;
      selectedSetting=selected.id;
      return '<div class="settings-layout"><nav class="settings-index" aria-label="دسته‌ها و تنظیمات">'+
        '<h2 class="settings-index-title">انواع تنظیمات</h2>'+settingsGroups.map(function(group){
          var categoryIcon=group.settings[0].icon;
          return '<div class="settings-nav-group"><div class="settings-category">'+
            '<span class="settings-category-icon">'+settingsIcon(categoryIcon)+'</span><span class="settings-category-label">'+settingsEscape(group.name)+'</span>'+
            '<span class="settings-category-count">'+settingsFaNumber(group.settings.length)+'</span>'+
            '</div><div class="settings-subnav">'+group.settings.map(function(setting){
              return '<button class="settings-subitem" type="button" data-setting="'+setting.id+'" aria-current="'+(setting.id===selected.id?'page':'false')+'">'+settingsEscape(setting.name)+'</button>';
            }).join("")+'</div></div>';
        }).join("")+'</nav><section class="settings-content" aria-live="polite">'+
        settingsCard(selected)+'</section></div>';
    }
    function settingsFaNumber(value){
      return String(value).replace(/\d/g,function(digit){return "۰۱۲۳۴۵۶۷۸۹"[Number(digit)];});
    }
    function settingsTwo(){
      return '<div class="settings-accordion">'+settingsGroups.map(function(group){
        return '<details open id="group-'+group.id+'"><summary>'+settingsEscape(group.name)+'</summary>'+
          settingsGroupMarkup(group,false)+'</details>';
      }).join("")+'</div>';
    }
    function settingsThree(){
      return '<nav class="settings-tabs" aria-label="گروه‌های تنظیمات">'+settingsGroups.map(function(group,index){
        return '<a href="#group-'+group.id+'"'+(index===0?' aria-current="location"':'')+'>'+settingsEscape(group.name)+'</a>';
      }).join("")+'</nav><div class="settings-groups">'+settingsGroups.map(function(group){
        return settingsGroupMarkup(group,true);
      }).join("")+'</div>';
    }
    function renderSettings(layout){
      var selected=layout||"one";
      settingsHost.innerHTML=selected==="two"?settingsTwo():selected==="three"?settingsThree():settingsOne();
      settingsSidebar.querySelectorAll("[data-layout]").forEach(function(button){
        var active=button.getAttribute("data-layout")===selected;
        button.classList.toggle("active",active);
        button.setAttribute("aria-pressed",String(active));
      });
    }
    settingsSidebar.addEventListener("click",function(event){
      var button=event.target.closest("[data-layout]");
      if(!button)return;
      renderSettings(button.getAttribute("data-layout"));
      document.getElementById("appView").scrollTop=0;
    });
    settingsHost.addEventListener("click",function(event){
      var setting=event.target.closest("[data-setting]");
      if(setting){
        selectedSetting=setting.getAttribute("data-setting");
        var owner=settingsGroups.filter(function(group){
          return group.settings.some(function(item){return item.id===selectedSetting;});
        })[0];
        if(!owner)return;
        selectedSettingsGroup=owner.id;
        renderSettings("one");
      }
    });
    renderSettings("one");
  </script>
